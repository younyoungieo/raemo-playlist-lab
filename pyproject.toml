[project]
name = "raemo-playlist-lab"
version = "0.1.0"
description = "raemo YouTube playlist automation: dataset building, curation, and production"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2024.1.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.5.0",
    "regex>=2023.12.0",
    "python-dotenv>=1.0.0",
    "lxml>=5.0.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
